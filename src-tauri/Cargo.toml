[package]
name = "inkode"
version = "0.1.0"
description = "Inkode — a quiet space for Markdown and code"
edition = "2021"
license = "MIT"
repository = "https://github.com/Cacolet/inkode"

[lib]
name = "inkode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.16"
sha2 = "0.10"
tempfile = "3"
notify = "8"
